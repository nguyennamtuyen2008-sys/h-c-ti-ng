<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Học từ vựng tiếng Trung</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>📚 Học từ vựng tiếng Trung</h1>

<p class="subtitle">
Giáo trình Đương Đại (Bài 1 → 12)
</p>

<select id="lessonSelect">

<option value="all">📖 Học tất cả</option>

<option value="1">Bài 1</option>
<option value="2">Bài 2</option>
<option value="3">Bài 3</option>
<option value="4">Bài 4</option>
<option value="5">Bài 5</option>
<option value="6">Bài 6</option>
<option value="7">Bài 7</option>
<option value="8">Bài 8</option>
<option value="9">Bài 9</option>
<option value="10">Bài 10</option>
<option value="11">Bài 11</option>
<option value="12">Bài 12</option>

</select>

<div class="progressBox">

<div class="progress">

<div id="progressBar"></div>

</div>

<p id="progressText">
0 / 0 từ
</p>

</div>

<div class="card" id="card">

<div class="front">

<div id="lesson" class="lesson"></div>

<div id="word" class="word">
Đang tải...
</div>

</div>

<div class="back">

<h2 id="backWord"></h2>

<h3 id="backPinyin"></h3>

<p id="backMeaning"></p>

</div>

</div>

<input
id="answer"
type="text"
placeholder="Nhập chữ Hán hoặc Pinyin">

<div class="buttonGroup">

<button id="checkBtn">
✅ Kiểm tra
</button>

<button id="nextBtn">
➡️ Từ tiếp theo
</button>

</div>

<div id="result"></div>

<div class="score">

<div class="box">

Đúng

<h2 id="correct">
0
</h2>

</div>

<div class="box">

Sai

<h2 id="wrong">
0
</h2>

</div>

<div class="box">

Còn lại

<h2 id="remain">
0
</h2>

</div>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
