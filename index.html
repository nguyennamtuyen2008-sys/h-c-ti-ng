<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm Tra Từ Vựng Tiếng Trung Bài 1 - 12</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }
        .card-container {
            width: 100%;
            height: 250px;
            perspective: 1000px;
            margin-bottom: 20px;
        }
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s ease;
            cursor: pointer;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .card.flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            padding: 20px;
            background: #ffffff;
            border: 2px solid #e1e8ed;
        }
        .card-back {
            transform: rotateY(180deg);
            background: #f0fdf4;
            border-color: #bbf7d0;
        }
        .hanzi-front {
            font-size: 3rem;
            color: #1f2937;
            font-weight: bold;
            text-align: center;
        }
        .lesson-tag {
            position: absolute;
            top: 15px;
            left: 20px;
            background: #e0e7ff;
            color: #3730a3;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .meaning-back {
            font-size: 1.4rem;
            color: #166534;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }
        .pinyin-back {
            font-size: 1.1rem;
            color: #374151;
            text-align: center;
        }
        .input-group {
            width: 100%;
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #d1d5db;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
            background: #fff;
        }
        input:focus {
            border-color: #4f46e5;
        }
        button {
            padding: 12px 20px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
        }
        button:hover {
            background: #4338ca;
        }
        .btn-next {
            width: 100%;
            background: #059669;
            box-shadow: 0 4px 10px rgba(5, 150, 105, 0.3);
        }
        .btn-next:hover {
            background: #047857;
        }
        .result-msg {
            margin-top: 10px;
            font-size: 1rem;
            font-weight: bold;
            min-height: 24px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📚 Ôn Tập Từ Vựng (Bài 1 - 12)</h1>
        
        <div class="card-container" onclick="flipCard()">
            <div class="card" id="flashcard">
                <div class="card-face">
                    <span class="lesson-tag" id="currentLesson">Đang tải...</span>
                    <div class="hanzi-front" id="displayHanzi">⏳</div>
                    <p style="color: #9ca3af; font-size: 0.85rem; margin-top: 15px;">(Chạm để lật hoặc bấm Kiểm tra)</p>
                </div>
                <div class="card-face card-back">
                    <div class="meaning-back" id="displayMeaning">...</div>
                    <div class="pinyin-back" id="displayPinyin">...</div>
                </div>
            </div>
        </div>

        <div class="input-group">
            <input type="text" id="userInput" placeholder="Nhập Pinyin hoặc nghĩa..." autocomplete="off">
            <button onclick="checkAnswer()">Kiểm tra</button>
        </div>

        <button class="btn-next" onclick="nextCard()">Từ tiếp theo ➡️</button>
        <div class="result-msg" id="resultMsg"></div>
    </div>

    <script>
        let vocabData = [];
        let currentIndex = 0;

        async function loadVocabData() {
            try {
                const response = await fetch('vocab.json');
                vocabData = await response.json();
                nextCard();
            } catch (error) {
                document.getElementById('displayHanzi').innerText = 'Lỗi!';
                document.getElementById('currentLesson').innerText = 'Lỗi tải dữ liệu';
                console.error("Không thể tải file vocab.json:", error);
            }
        }

        function loadCard() {
            if (vocabData.length === 0) return;
            const card = document.getElementById('flashcard');
            card.classList.remove('flipped');
            
            document.getElementById('currentLesson').innerText = vocabData[currentIndex].lesson;
            document.getElementById('displayHanzi').innerText = vocabData[currentIndex].hanzi;
            document.getElementById('displayMeaning').innerText = vocabData[currentIndex].meaning;
            document.getElementById('displayPinyin').innerText = vocabData[currentIndex].pinyin;
            
            document.getElementById('userInput').value = '';
            document.getElementById('resultMsg').innerText = '';
        }

        function flipCard() {
            const card = document.getElementById('flashcard');
            card.classList.toggle('flipped');
        }

        function checkAnswer() {
            if (vocabData.length === 0) return;
            const userIn = document.getElementById('userInput').value.trim().toLowerCase();
            const current = vocabData[currentIndex];
            const msg = document.getElementById('resultMsg');

            document.getElementById('flashcard').classList.add('flipped');

            if (!userIn) {
                msg.style.color = '#d97706';
                msg.innerText = 'Bạn chưa nhập đáp án! Hãy xem đáp án phía sau.';
                return;
            }

            const pinyinClean = current.pinyin.toLowerCase();
            const meaningClean = current.meaning.toLowerCase();

            if (pinyinClean.includes(userIn) || meaningClean.includes(userIn) || userIn === current.hanzi) {
                msg.style.color = '#16a34a';
                msg.innerText = '🎉 Chính xác! Bạn rất giỏi.';
            } else {
                msg.style.color = '#dc2626';
                msg.innerText = '❌ Chưa chính xác. Hãy xem đáp án đúng ở mặt sau!';
            }
        }

        function nextCard() {
            if (vocabData.length === 0) return;
            currentIndex = Math.floor(Math.random() * vocabData.length);
            loadCard();
        }

        window.onload = () => {
            loadVocabData();
        };
    </script>
</body>
</html>
