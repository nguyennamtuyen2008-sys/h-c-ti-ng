<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học từ vựng tiếng Trung</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>📚 Học từ vựng tiếng Trung cùng Tuyên nha</h1>

    <p class="subtitle">
    Giáo trình Đương Đại (Bài 1 → Bài 15)
    </p>

    <select id="lessonSelect">

        <option value="all">📖 Tất cả bài</option>

        <option value="1">Bài 1</option>
        <option value="2">Bài 2</option>
        <option value="3">Bài 3</option>
        <option value="4">Bài 4</option>
        <option value="5">Bài 5</option>
        <option value="6">Bài 6</option>
        <option value="7">Bài 7</option>
        <option value="8">Bài 8</option>
        <option value="9">Bài 9</option>
        <option value="10">Bài 10</option>
        <option value="11">Bài 11</option>
        <option value="12">Bài 12</option>
        <option value="13">Bài 13</option>
        <option value="14">Bài 14</option>
        <option value="15">Bài 15</option>
    </select>

    <!-- Thanh tiến độ -->

    <div class="progressBox">

        <div class="progress">

            <div id="progressBar"></div>

        </div>

        <div id="progressText">0 / 0 từ</div>

    </div>

    <!-- Thẻ từ -->

    <div class="card" id="card">

        <div class="front">

            <div class="lesson" id="lesson"></div>

            <div class="word" id="word">
                Đang tải...
            </div>

        </div>

        <div class="back">

            <h2 id="backWord"></h2>

            <h3 id="backPinyin"></h3>

            <p id="backMeaning"></p>

        </div>

    </div>

    <!-- Ô nhập -->

    <input
        type="text"
        id="answer"
        placeholder="Nhập chữ Hán hoặc Pinyin">

    <!-- Nút -->

    <div class="buttonGroup">

        <button id="checkBtn">

            ✅ Kiểm tra

        </button>

        <button id="nextBtn">

            ➡️ Từ tiếp theo

        </button>

    </div>

    <!-- Kết quả -->

    <div id="result"></div>

    <!-- Điểm -->

    <div class="score">

        <div class="box">

            <div>✅ Đúng</div>

            <h2 id="correct">0</h2>

        </div>

        <div class="box">

            <div>❌ Sai</div>

            <h2 id="wrong">0</h2>

        </div>

        <div class="box">

            <div>📖 Còn lại</div>

            <h2 id="remain">0</h2>

        </div>

    </div>

</div>

<script src="script.js"></script>
<!-- Popup thông báo -->
<div id="resultPopup" class="popup-overlay">
  <div class="popup-box">
    <div id="popupIcon" class="popup-icon">❌</div>

    <h2 id="popupTitle">Sai rồi bạn ơi!</h2>

    <div class="popup-answer">
      <div id="popupHanzi" class="hanzi"></div>
      <div id="popupPinyin" class="pinyin"></div>
      <div id="popupMeaning" class="meaning"></div>
    </div>

    <p id="popupMessage">
      💪 Đừng nản nhé, học thêm một chút là nhớ ngay!
    </p>

    <button onclick="closePopup()">Tiếp tục</button>
  </div>
</div>
    
</body>

</html>
